<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" role="img" aria-labelledby="title description">
  <title id="title">Production image placeholder</title>
  <desc id="description">Neutral placeholder awaiting an original DEMIAND manufacturing photograph.</desc>
  <defs>
    <pattern id="lines" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="36" fill="#e8e9ec"/>
      <rect x="18" width="18" height="36" fill="#eceef0"/>
    </pattern>
    <radialGradient id="light" cx="78%" cy="12%" r="86%">
      <stop offset="0" stop-color="#fff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="1200" fill="url(#lines)"/>
  <rect width="960" height="1200" fill="url(#light)"/>
  <path d="M90 170H430M530 1030H870" stroke="#c7cad0" stroke-width="2"/>
  <circle cx="480" cy="570" r="74" fill="none" stroke="#d9001b" stroke-width="2"/>
  <circle cx="480" cy="570" r="7" fill="#d9001b"/>
  <text x="480" y="700" text-anchor="middle" fill="#5e626c" font-family="Arial, sans-serif" font-size="38" letter-spacing="5">PRODUCTION IMAGE</text>
  <text x="480" y="742" text-anchor="middle" fill="#7e828a" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">ORIGINAL ASSET PENDING</text>
</svg>
